<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-labelledby="title desc">
  <title id="title">NC Futures logo — muted blue</title>
  <desc id="desc">Three rising muted blue bars beside the words NC Futures</desc>
  <g fill="#5980a6">
    <rect x="28" y="92" width="24" height="36" rx="2"/>
    <rect x="58" y="65" width="24" height="63" rx="2"/>
    <rect x="88" y="28" width="24" height="100" rx="2"/>
  </g>
  <text x="132" y="128" fill="#1d1b20" stroke="#5980a6" stroke-width="1.25" paint-order="stroke fill" font-family="Roboto, Arial, sans-serif" font-size="90">
    <tspan font-weight="400" letter-spacing="-1.8">NC</tspan>
    <tspan dx="2.00" font-weight="400" letter-spacing="-1.8">Futures</tspan>
  </text>
</svg>
